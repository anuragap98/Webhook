{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block header %}User Profile{% endblock %}

{% block content %}
<div class="profile-container">
    <div class="profile-card">
        <h2>{{ user.username }}</h2>
        <p class="email">{{ user.email }}</p>
        <div class="bio">
            <h3>Bio</h3>
            <p>{{ user.profile.bio|default:"No bio set." }}</p>
        </div>
        <div class="profile-actions" style="margin-top: 2rem;">
            <a href="{% url 'users:edit_profile' %}" class="btn btn-primary">Edit Profile</a>
            <a href="{% url 'users:change_password' %}" class="btn btn-secondary">Change Password</a>
        </div>
    </div>
</div>
{% endblock %}
